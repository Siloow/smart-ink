name: CI

on:
  push:
    branches: [main, beta]
  pull_request:
    branches: [main, beta]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Editor and rendering regression tests
        run: npm run test:demo

      - name: RunPod frontend regression tests
        run: node tools/runpod-render-service.test.mjs

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Render gateway access and job tests
        run: deno test tools/render-gateway.test.ts

      - name: Build
        run: npm run build

      # The production bundle once reached 207 MB because public/ pulled the
      # whole Blender working tree into dist/. It is ~16 MB now (four body
      # meshes plus the app); fail if it creeps past 25 MB.
      - name: Report and limit dist size
        run: |
          echo "## Build output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          du -sh dist | tee -a "$GITHUB_STEP_SUMMARY"
          du -sh dist/* | sort -h | tail -n 8 | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          size_kb=$(du -sk dist | cut -f1)
          limit_kb=$((25 * 1024))
          if [ "$size_kb" -gt "$limit_kb" ]; then
            echo "::error::dist/ is ${size_kb} KB, over the ${limit_kb} KB limit. Something large landed in public/."
            exit 1
          fi
